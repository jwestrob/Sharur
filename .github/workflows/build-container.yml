name: Build and Push Container
# Manually triggered only. Requires pixi.lock to exist (the Dockerfile runs
# `pixi install --locked`). Registry is configurable — GHCR is the starting
# point; the final publish location is a TODO.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Container registry"
        default: ghcr.io
        type: string
      tag:
        description: "Image tag"
        default: manual
        type: string
      push:
        description: "Push image to the registry (otherwise build only)"
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-gpu
            suffix: "-gpu"
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=${{ inputs.registry }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ inputs.push }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}${{ matrix.suffix }}
          # TODO(user): once the git-source tools are pinned, pass them through as
          # build args (backed by repo Variables) and uncomment in the Dockerfile:
          #   build-args: |
          #     ASTRA_REPO=${{ vars.ASTRA_REPO }}
          #     ASTRA_REF=${{ vars.ASTRA_REF }}
          #     ELSA_REPO=${{ vars.ELSA_REPO }}
          #     ELSA_REF=${{ vars.ELSA_REF }}
