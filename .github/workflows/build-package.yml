name: Build Package
# Manually triggered only.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Independent of pixi/bioconda — hatchling just needs the source tree.
      # Validates the dynamic-version wiring (version read from sharur/__init__.py).
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Show built version
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sharur-dist
          path: dist/*
          if-no-files-found: error
