<div class="panel notes" data-notes-kind="{{ note_kind }}" data-notes-id="{{ note_id }}">
  <h2>Curation <span class="hint">flags and notes are yours; they never change the evidence-backed labels</span></h2>
  <div class="flag-buttons"></div>
  <div class="note-list"></div>
  <form class="note-form"><textarea rows="2" placeholder="Add a note (Enter to save, Shift+Enter for a new line)"></textarea><button type="submit">Save note</button></form>
  <p class="note who"></p>
</div>
