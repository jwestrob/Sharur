name: sharur
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python (Aksha, the Stage 04 HMM search, ships wheels for Python 3.12)
  - python=3.12
  - pip

  # Compiled scientific libs (conda-forge)
  - numpy
  - scipy
  - pandas<3             # Aksha 0.2.1's KOFAM installer fails on pandas 3
  - pyarrow
  - h5py
  - matplotlib

  # Bioinformatics CLI tools (bioconda)
  - prodigal
  - diamond
  - hmmer
  - minced
  - mmseqs2             # optional Stage 09 protein families (--with-families)
  - quast
  - dfast_qc            # invoked by src/ingest/02_dfast_qc.py
  - gecco
  - dbcan               # run_dbcan / dbCAN HMMdb
  - kalign3             # multiple sequence alignment
  - foldseek

  # Document generation (conda-forge)
  - pandoc

  # pip-only packages
  - pip:
      - -e ".[all,dev]"
      # Aksha runs Stage 04's HMM searches; its compiled runtime ships for Linux x86-64 only.
      - aksha; sys_platform == "linux" and platform_machine == "x86_64"
      # MacSyFinder's `macsydata` downloads the DefenseFinder models that Stage 07's
      # defense-system caller reads (see INSTALL.md).
      - macsyfinder==2.1.4
