# Conda environment — a NO-PIXI FALLBACK only.
#
# pixi.toml / pixi.lock are the authoritative, reproducible environment (see
# CONTRIBUTING.md). This file is kept for contributors who don't use pixi and
# may lag behind pixi.toml.
#
# Usage:
#   conda env create -f environment.yml && conda activate sharur
#   pip install -e ".[dev]"     # editable install is a separate, explicit step
name: sharur
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.12
  - pip

  # Compiled scientific libs (conda-forge)
  - numpy
  - scipy
  - pandas
  - pyarrow
  - h5py
  - matplotlib

  # Bioinformatics CLI tools (bioconda)
  - prodigal
  - diamond
  - hmmer
  - quast
  - dfast_qc            # invoked by src/ingest/02_dfast_qc.py
  - minced
  - gecco
  - dbcan               # run_dbcan / dbCAN HMMdb
  - kalign3             # multiple sequence alignment
  - foldseek

  # Document generation (conda-forge)
  - pandoc

  # pip-only packages (defense-system validation; installed --no-deps to avoid
  # a click version clash with typer)
  - pip:
      # Defense system co-location validation
      - macsyfinder==2.1.4
      - --no-deps mdmparis-defense-finder
