name: sharur
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.12
  - pip

  # Compiled scientific libs (conda-forge)
  - numpy
  - scipy
  - pandas
  - pyarrow
  - h5py
  - matplotlib

  # Bioinformatics CLI tools (bioconda)
  - prodigal
  - diamond
  - hmmer
  - quast
  - dfast_qc            # invoked by src/ingest/02_dfast_qc.py
  - minced
  - gecco
  - dbcan               # run_dbcan / dbCAN HMMdb
  - kalign3             # multiple sequence alignment
  - foldseek

  # Document generation (conda-forge)
  - pandoc

  # pip-only packages
  - pip:
      - -e ".[all,dev]"
      # Defense system co-location validation
      - macsyfinder==2.1.4
      - --no-deps mdmparis-defense-finder
